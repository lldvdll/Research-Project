<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700"
     role="img" aria-label="Backprop and predictive coding compared. Backprop takes one derivative of its objective L, with respect to the weights, via the chain rule. Predictive coding takes two derivatives of its own objective F: first with respect to the hidden state, holding weights fixed, to settle; then with respect to the weights, holding the settled state fixed, to learn."
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Backprop and predictive coding: the same row, two different derivatives</title>
  <desc>Two panels sharing one column grid. Red marks the forward or prediction direction, green marks
  the settling force on the free node, blue marks the weight update, both dashed alike. Predictive
  coding's error nodes e1 and e2 sit attached to their own node, each receiving that node's actual
  value and the prediction arriving from the other side. F, defined next to them, is the sum of their
  squares -- Whittington and Bogacz 2017 name it as predictive coding's counterpart to backprop's
  objective L. The green arrow is dF/dx1, taken with weights fixed; the blue arrows are dF/dW, taken
  with the settled state fixed -- the same F, two different derivatives. A diagonal mark on a node
  means it is held fixed; a plain circle is free. A small circle that two lines enter is a product.</desc>

  <defs>
    <marker id="aF" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#C0392B"/>
    </marker>
    <marker id="aFs" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#C0392B"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#0E7C5A"/>
    </marker>
    <marker id="aU" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect id="bg" x="0" y="0" width="1060" height="700" fill="#FCFCFB"/>

  <!-- ==================================================================== -->
  <!-- PANEL 1 : BACKPROP                                                   -->
  <!-- ==================================================================== -->
  <g id="panel-backprop">
    <text x="60" y="44" font-size="15" font-weight="700" letter-spacing="1.6" fill="#16181C">BACKPROP</text>
    <text x="60" y="63" font-size="11.5" fill="#6B7280">one objective, L &#8212; one derivative, &#8706;L/&#8706;W, taken by the chain rule</text>
    <text x="1000" y="44" font-size="11.5" font-weight="600" text-anchor="end" fill="#1D4ED8">update path: output &#8594; every weight</text>

    <g stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#aF)">
      <line x1="201" y1="150" x2="284" y2="150"/>
      <line x1="336" y1="150" x2="419" y2="150"/>
      <line x1="471" y1="150" x2="554" y2="150"/>
      <line x1="606" y1="150" x2="689" y2="150"/>
      <line x1="741" y1="150" x2="851" y2="150"/>
    </g>

    <g fill="#FCFCFB" stroke="#16181C" stroke-width="1.4">
      <rect x="286" y="136" width="48" height="28" rx="5"/>
      <rect x="556" y="136" width="48" height="28" rx="5"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#16181C">
      <text x="310" y="155">W&#8321;</text>
      <text x="580" y="155">W&#8322;</text>
    </g>

    <g fill="#FCFCFB" stroke="#16181C" stroke-width="1.8">
      <circle cx="175" cy="150" r="24"/>
      <circle cx="445" cy="150" r="24"/>
      <circle cx="715" cy="150" r="24"/>
    </g>
    <line x1="157" y1="132" x2="166" y2="141" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="184" y1="159" x2="193" y2="168" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <g font-size="15" text-anchor="middle" fill="#16181C">
      <text x="175" y="155.5">x&#8320;</text>
      <text x="445" y="155.5">x&#8321;</text>
      <text x="715" y="155.5">x&#8322;</text>
    </g>

    <rect x="855" y="130" width="90" height="40" rx="6" fill="#FCFCFB" stroke="#16181C" stroke-width="1.4"/>
    <text x="900" y="155" font-size="14" text-anchor="middle" fill="#16181C">L(y)</text>

    <g stroke="#1D4ED8" stroke-width="2" fill="none" stroke-dasharray="7 5">
      <path d="M900 172 L900 228 L310 228"/>
      <path d="M580 228 L580 168" marker-end="url(#aU)"/>
      <path d="M310 228 L310 168" marker-end="url(#aU)"/>
    </g>
    <g font-size="11.5" fill="#1D4ED8">
      <text x="598" y="206">&#8706;L/&#8706;W&#8322;</text>
      <text x="328" y="206">&#8706;L/&#8706;W&#8321;</text>
    </g>
    <text x="1000" y="252" font-size="11" text-anchor="end" fill="#6B7280">one signal, formed at the output, carried back to every weight</text>
  </g>

  <line x1="60" y1="280" x2="1000" y2="280" stroke="#16181C" stroke-width="1" opacity="0.15"/>

  <!-- ==================================================================== -->
  <!-- PANEL 2 : PREDICTIVE CODING                                          -->
  <!-- e1, e2 sit ON their own node, each fed by that node's actual value    -->
  <!-- (thin) and by the prediction arriving from the other side (red tap).  -->
  <!-- F is 1/2(e1^2+e2^2), defined once, textually, next to them.          -->
  <!-- Whittington and Bogacz 2017 Table 1 name it predictive coding's      -->
  <!-- objective, the counterpart of backprop's L. Two derivatives of it    -->
  <!-- are drawn: dF/dx1 (green, weights fixed) and dF/dW (blue, x fixed).  -->
  <!-- ==================================================================== -->
  <g id="panel-pc">
    <text x="60" y="314" font-size="15" font-weight="700" letter-spacing="1.6" fill="#16181C">PREDICTIVE CODING</text>
    <text x="60" y="333" font-size="11.5" fill="#6B7280">one objective, F &#8212; two derivatives: &#8706;F/&#8706;x settles, then &#8706;F/&#8706;W learns</text>
    <text x="1000" y="314" font-size="11.5" font-weight="600" text-anchor="end" fill="#1D4ED8">update path: one edge</text>

    <!-- forward: x0 predicts through W1, x1 predicts through W2 -->
    <g stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#aF)">
      <line x1="201" y1="430" x2="284" y2="430"/>
      <line x1="336" y1="430" x2="419" y2="430"/>
      <line x1="471" y1="430" x2="554" y2="430"/>
      <line x1="606" y1="430" x2="689" y2="430"/>
    </g>
    <g fill="#FCFCFB" stroke="#16181C" stroke-width="1.4">
      <rect x="286" y="416" width="48" height="28" rx="5"/>
      <rect x="556" y="416" width="48" height="28" rx="5"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#16181C">
      <text x="310" y="435">W&#8321;</text>
      <text x="580" y="435">W&#8322;</text>
    </g>

    <!-- nodes -->
    <g fill="#FCFCFB" stroke="#16181C" stroke-width="1.8">
      <circle cx="175" cy="430" r="24"/>
      <circle cx="445" cy="430" r="24"/>
      <circle cx="715" cy="430" r="24"/>
    </g>
    <line x1="157" y1="412" x2="166" y2="421" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="184" y1="439" x2="193" y2="448" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="697" y1="412" x2="706" y2="421" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="724" y1="439" x2="733" y2="448" stroke="#16181C" stroke-width="1.8" stroke-linecap="round"/>
    <g font-size="15" text-anchor="middle" fill="#16181C">
      <text x="175" y="435.5">x&#8320;</text>
      <text x="445" y="435.5">x&#8321;</text>
      <text x="715" y="435.5">y</text>
    </g>

    <!-- e1 sits in the W1-x1 gap: tapped from the prediction ARRIVING at x1 (segment W1->x1), -->
    <!-- not from x1's own outgoing signal. e1 = x1 minus that incoming prediction. -->
    <path d="M378,430 L378,462" stroke="#C0392B" stroke-width="1.6" fill="none" marker-end="url(#aFs)"/>
    <line x1="424" y1="447" x2="396" y2="465" stroke="#16181C" stroke-width="1.2" opacity="0.45"/>
    <rect x="362" y="465" width="32" height="27" rx="4" fill="#FCFCFB" stroke="#16181C" stroke-width="1.6"/>
    <text x="378" y="483" font-size="13" text-anchor="middle" fill="#16181C">e&#8321;</text>
    <text x="398" y="512" font-size="10.5" fill="#6B7280">e&#8321; = x&#8321; &#8722; &#956;&#8321;</text>

    <!-- e2 sits in the W2-y gap: tapped from the prediction arriving at y. -->
    <path d="M648,430 L648,462" stroke="#C0392B" stroke-width="1.6" fill="none" marker-end="url(#aFs)"/>
    <line x1="697" y1="447" x2="668" y2="465" stroke="#16181C" stroke-width="1.2" opacity="0.45"/>
    <rect x="632" y="465" width="32" height="27" rx="4" fill="#FCFCFB" stroke="#16181C" stroke-width="1.6"/>
    <text x="648" y="483" font-size="13" text-anchor="middle" fill="#16181C">e&#8322;</text>
    <text x="668" y="512" font-size="10.5" fill="#6B7280">e&#8322; = y &#8722; &#956;&#8322;</text>

    <!-- F, defined once, in the open space right of e2. Not a box other lines run to. -->
    <text x="820" y="483" font-size="12.5" fill="#16181C">F = &#189;(e&#8321;&#178; + e&#8322;&#178;)</text>

    <!-- the settling force on x1: two terms, both landing on x1. e1's is short and local; -->
    <!-- e2's is routed via W2^T, and clears above W2's box on its way to x1. -->
    <path d="M368,465 C 390,450 405,440 423,431" stroke="#0E7C5A" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
    <path d="M648,465 C 600,400 520,392 462,412" stroke="#0E7C5A" stroke-width="2.2" fill="none" marker-end="url(#aS)"/>
    <text x="605" y="390" font-size="10.5" fill="#0E7C5A">via W&#8322;<tspan dy="-4" font-size="8">T</tspan></text>
    <text x="270" y="397" font-size="11.5" text-anchor="middle" fill="#0E7C5A">&#8706;F/&#8706;x&#8321; = e&#8321; &#8722; f'(x&#8321;)&#183;e&#8322;W&#8322;<tspan dy="-4" font-size="8">T</tspan></text>

    <!-- the weight updates: dF/dW, x0/e1 and x1/e2 each feed a small product circle -->
    <g stroke="#1D4ED8" stroke-width="2" fill="none" stroke-dasharray="7 5">
      <path d="M182,452 C 220,590 260,608 296,610"/>
      <path d="M366,492 C 350,550 330,595 308,608"/>
      <path d="M452,452 C 490,590 530,608 566,610"/>
      <path d="M636,492 C 620,550 600,595 588,608"/>
    </g>
    <circle cx="310" cy="610" r="11" fill="#FCFCFB" stroke="#1D4ED8" stroke-width="1.8"/>
    <circle cx="580" cy="610" r="11" fill="#FCFCFB" stroke="#1D4ED8" stroke-width="1.8"/>
    <g stroke="#1D4ED8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#aU)">
      <line x1="310" y1="599" x2="310" y2="448"/>
      <line x1="580" y1="599" x2="580" y2="448"/>
    </g>
    <g font-size="11.5" text-anchor="middle" fill="#1D4ED8">
      <text x="310" y="638">&#8706;F/&#8706;W&#8321; = x&#8320; &#183; e&#8321;</text>
      <text x="580" y="638">&#8706;F/&#8706;W&#8322; = x&#8321; &#183; e&#8322;</text>
    </g>
    <text x="1000" y="638" font-size="11" text-anchor="end" fill="#6B7280">x fixed at its settled value; every update reads only its own edge</text>
  </g>

  <!-- ==================================================================== -->
  <!-- LEGEND                                                               -->
  <!-- ==================================================================== -->
  <g id="legend" font-size="11" fill="#16181C">
    <line x1="60" y1="665" x2="1000" y2="665" stroke="#16181C" stroke-width="1" opacity="0.15"/>

    <line x1="60" y1="690" x2="86" y2="690" stroke="#C0392B" stroke-width="2" marker-end="url(#aF)"/>
    <text x="98" y="694">forward &#183; prediction</text>

    <line x1="238" y1="690" x2="264" y2="690" stroke="#0E7C5A" stroke-width="2" marker-end="url(#aS)"/>
    <text x="276" y="694">settling &#183; &#8706;F/&#8706;x, weights fixed</text>

    <line x1="470" y1="690" x2="496" y2="690" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aU)"/>
    <text x="508" y="694">weight update &#183; &#8706;F/&#8706;W, x fixed</text>

    <line x1="722" y1="678" x2="734" y2="685" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="722" y1="700" x2="734" y2="693" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="740" cy="690" r="8" fill="#FCFCFB" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="754" y="694">product</text>

    <circle cx="828" cy="690" r="9" fill="#FCFCFB" stroke="#16181C" stroke-width="1.6"/>
    <line x1="821" y1="683.5" x2="826" y2="688" stroke="#16181C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="830" y1="692" x2="835" y2="696.5" stroke="#16181C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="844" y="694">clamped</text>

    <circle cx="920" cy="690" r="9" fill="#FCFCFB" stroke="#16181C" stroke-width="1.6"/>
    <text x="936" y="694">free</text>
  </g>
</svg>
